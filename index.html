function drum(t0,kind){try{

  else{const s=AC.createBufferSource();s.buffer=noiseBuf();
    const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=kind==='hat'?7500:1800;
    const g=AC.createGain();
    g.gain.setValueAtTime(kind==='hat'?0.018:0.05,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+(kind==='hat'?0.03:0.09));
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t0);s.stop(t0+0.1);}}catch(e){}}
/* 4小節ループ（8分×32歩）: Am → F → C → G */
const ROOTS=[110,87.3,130.8,98];
const LEAD32=[659,523,440,523, 659,880,784,659,  698,880,784,698, 659,587,523,587,
              659,784,1046,988, 880,784,659,523,  587,659,784,880, 988,784,659,587];
function bgmTick(){
  if(!BGM.on||!AC)return;
  const rush=G&&state==='play'&&G.left<=25;
  const spb=60/(rush?180:158)/2, mul=rush?1.0595:1;
  while(BGM.next<AC.currentTime+0.18){
    const s=BGM.step%32, bar=(s/8)|0, t0=BGM.next;
    if(s%2===0)drum(t0,'kick');                              // 4つ打ち
    if(s%8===2||s%8===6)drum(t0,'snare');                    // 2・4拍
    drum(t0,'hat');                                          // 刻み
    const root=ROOTS[bar]*(s%2?2:1);                         // オクターブ跳ねベース
    bgmTone(root*mul,t0,spb*0.85,'square',0.03);
    bgmTone(LEAD32[s]*mul,t0,spb*0.9,'square',0.02);         // リード（常時）
    if(((BGM.step/32)|0)%2===1)bgmTone(LEAD32[s]*mul*1.5,t0,spb*0.8,'triangle',0.014); // 5度ハモリ
    BGM.next+=spb;BGM.step++;
  }}
function bgmStart(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();

function genDish(e){
  const pool= e<10?['kake','kitsune','tsukimi','onigiri']
            : e<30?['kake','kitsune','tsukimi','onigiri','ebi','kashiwa']
            : DKEYS;
  const ok=pool.filter(d=>G.custs.filter(c=>c&&c.dish===d).length<ORDER_CAP[d]);
  const p2=ok.length?ok:['kake'];
  return p2[(Math.random()*p2.length)|0];

function update(dt){
  if(state!=='play')return;
  G.t+=dt;G.left-=dt;G.msgT-=dt;
  if(G.eggCd>0)G.eggCd-=dt;
  if(G.onigCd>0)G.onigCd-=dt;
  G.chefX+=(G.chefTargetX-G.chefX)*Math.min(1,dt*9);
  G.spawnT-=dt;
  if(G.spawnT<=0){const free=G.custs.map((c,i)=>c?null:i).filter(v=>v!==null);
    if(free.length){const slot=free[(Math.random()*free.length)|0];const d=genDish(G.t),pt=CFG.patience(G.t);
      G.custs[slot]={dish:d,p:pt,maxP:pt,v:CVARS[(Math.random()*CVARS.length)|0],ph:Math.random()*6,id:++G.seq};
      SE.arrive();voice('welcome');}
    G.spawnT=CFG.spawn(G.t)*(0.8+Math.random()*0.4);}
  G.custs.forEach((c,i)=>{if(!c)return;c.p-=dt;
    if(c.p<=0){G.custs[i]=null;G.gone++;repAdd(-12);comboReset();SE.bye();
      voice('angry');
      pop(CUSTX[i]+42,CUSTY-4,'帰っちゃった…','#e0604a');}});
  /* ラスト10秒の時計 */
  if(G.left<=10&&G.left>0&&((G.left|0)!==((G.left+dt)|0)))SE.tick();
  G.kama.forEach((k,i)=>{if(k.st!=='boil')return;k.t+=dt;
    if(k.t>=CFG.boil&&k.t<CFG.boil+0.05)SE.ding();
    if(k.t>CFG.boil+CFG.golden){k.st='idle';k.t=0;wasteAt(KAMA[i].x+27,KAMA[i].y,'茹ですぎ');}});
  if(G.ageSim!=null){G.ageSim+=dt;if(G.ageSim>=CFG.ageSim){G.age=Math.min(CFG.ageCap,G.age+1);G.ageSim=null;SE.take();pop(AGE.x+25,AGE.y,'油揚げ完成','#e8b44a');}}
  G.fry.forEach((fj,i)=>{if(!fj)return;fj.t+=dt;
    if(fj.t>=FRIED[fj.k].fry){G.rack.push({k:fj.k,age:0});SE.take();pop(FRY[i].x+26,FRY[i].y-2,FRIED[fj.k].name+' あがり','#e8b44a');G.fry[i]=null;}});
  for(let i=G.rack.length-1;i>=0;i--){G.rack[i].age+=dt;if(G.rack[i].age>FRIED[G.rack[i].k].fresh){const k=G.rack[i].k;G.rack.splice(i,1);wasteAt(RACKZ.x+50,RACKZ.y,FRIED[k].name);}}
  for(let i=G.udon.length-1;i>=0;i--){G.udon[i].age+=dt;if(G.udon[i].age>CFG.nobi){G.udon.splice(i,1);wasteAt(UDONZ.x+50,UDONZ.y,'のびたうどん');}}
  G.pops.forEach(pp=>pp.t+=dt);G.pops=G.pops.filter(pp=>pp.t<1.3);
  G.kama.forEach((k,i)=>{if(k.st==='boil'&&Math.random()<dt*9)G.steam.push({x:KAMA[i].x+12+Math.random()*30,y:KAMA[i].y+6,t:0});});
  if(G.ageSim!=null&&Math.random()<dt*6)G.steam.push({x:AGE.x+16+Math.random()*18,y:AGE.y+6,t:0});
  G.steam.forEach(s=>{s.t+=dt;s.y-=dt*13;});G.steam=G.steam.filter(s=>s.t<1.6);
  if(G.rip){G.rip.t+=dt*2.6;if(G.rip.t>=1)G.rip=null;}
  G.chefF=((G.t*2.6)|0)%2;

  else if(G.left<=0){closed=false;setState('result');SE.over();playBGM('result');saveBest();}
}

function tapEgg(){moveChef(EGG.x+EGG.w/2);if(G.eggCd>0)return;

function tapCust(i){const c=G.custs[i];if(!c)return;const D=DISHES[c.dish];
  if(c.dish==='onigiri'){
    if(G.onigiri<=0){say('おにぎりを握って！');SE.buzz();return;}
    G.onigiri--;
  }else{
    if(!G.udon.length){say('うどんがまだ！');SE.buzz();return;}
    if(D.need){
      if(D.need==='age'){if(G.age<=0){say('油揚げを用意して！');SE.buzz();return;}}
      else if(D.need==='tamago'){if(G.tamago<=0){say('卵を用意して！');SE.buzz();return;}}
      else{if(!G.rack.filter(r=>r.k===D.need).length){say(FRIED[D.need].name+'を揚げて！');SE.buzz();return;}}
    }
    let ou=-1,ua=-1;G.udon.forEach((b,j)=>{if(b.age>ua){ua=b.age;ou=j;}});G.udon.splice(ou,1);
    if(D.need==='age')G.age--;
    else if(D.need==='tamago')G.tamago--;
    else if(D.need){let old=-1,age=-1;G.rack.forEach((r,j)=>{if(r.k===D.need&&r.age>age){age=r.age;old=j;}});G.rack.splice(old,1);}
  }
  G.money+=D.price;G.served++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);repAdd(4+Math.round(c.p/c.maxP*6));
  const bonus=G.combo>=3?Math.round(D.price*0.1*Math.min(G.combo-2,8)):0;G.money+=bonus;

  txt('天ぷらバット',RACKZ.x,RACKZ.y-15,8,'#c8b890');

    barUI(a,b+19,20,2,1-r.age/FRIED[r.k].fresh,r.age<FRIED[r.k].fresh*0.6?'#7fae5a':'#e0604a');});
  if(!G.rack.length)txt('からっぽ',RACKZ.x+6,RACKZ.y+8,8,'#5a4a34');
  /* 湯気 */
  G.steam.forEach(s=>{x.fillStyle='rgba(240,246,255,'+(0.5*(1-s.t/1.6))+')';x.fillRect((s.x+Math.sin(s.t*5)*2)|0,s.y|0,s.t<0.9?1:2,1);});
  if(G.rip&&G.rip.t<1){x.strokeStyle='rgba(240,200,106,'+(1-G.rip.t)+')';x.lineWidth=1.5;x.beginPath();x.arc(G.rip.x,G.rip.y,4+G.rip.t*16,0,7);x.stroke();}
  G.pops.forEach(pp=>{x.globalAlpha=Math.max(0,1-pp.t/1.3);txt(pp.s,pp.x,pp.y-pp.t*14,pp.big?12:9,pp.c,'center');x.globalAlpha=1;});
  if(G.msgT>0)txt('⚠ '+G.msg,W/2,H-14,10,'#e0604a','center');
}
function drawTitle(t){
  x.drawImage(BG,0,0);rct(0,0,W,H,'rgba(11,9,6,0.44)');
  txt('うどん繁盛記',W/2,140,30,'#e8b44a','center');
  txt('― カウンターの中は、いつも戦場 ―',W/2,182,10,'#c8b890','center');
  const lines=['釜=うどん / 卵台 / 煮込み鍋=油揚げ','フライヤー=天ぷら / おにぎり台',
    'メニューごとに必要な一手が違う。段取りが命。'];
  lines.forEach((s,i)=>txt(s,W/2,208+i*16,10,i===2?'#e8b44a':'#a89878','center'));
  DKEYS.forEach((k,i)=>{const bx=34+(i%4)*82,by=272+((i/4)|0)*66;drawBowl(bx,by,k,1.3);
    txt(DISHES[k].name,bx+14,by+20,8,'#f2e3c2','center');txt('¥'+DISHES[k].price,bx+14,by+31,7,'#c8a060','center');});
  if(((t*2)|0)%2)txt('▶ タップして開店',W/2,436,14,'#e8b44a','center');
  txt('自己ベスト ¥'+best.toLocaleString(),W/2,470,10,'#c8b890','center');
  txt('BGM: Juhani Junkala (CC0)／声: 効果音ラボ／Font: PixelMplus',W/2,592,7,'#7a705c','center');
}
function drawResult(t){
  x.drawImage(BG,0,0);rct(0,0,W,H,'rgba(11,9,6,0.68)');
  txt(closed?'閉  店  …':'営業終了！',W/2,90,24,closed?'#e0604a':'#e8b44a','center');
  const rows=[['売上','¥'+G.money.toLocaleString()],['提供',G.served+'人'],
    ['帰ってしまった',G.gone+'人'],['廃棄',G.waste+'品'],
    ['最大連続',G.maxCombo+'人'],['最終評判',Math.round(G.rep)+' / 100']];
  rows.forEach((r,i)=>{txt(r[0],46,150+i*24,10,'#8b90a8');txt(String(r[1]),314,150+i*24,10,'#f2e3c2','right');});
  /* S＝ほぼ完璧のみ: 売上13,000以上＋離脱0＋廃棄1以下 */
  let rank='C',msg='まずは一杯ずつ、確実に。';
  if(!closed){
    if(G.money>=13000&&G.gone===0&&G.waste<=1){rank='S';msg='完璧な仕事…伝説の釜番だ！！';}
    else if(G.money>=8500){rank='A';msg='昼のピークも任せられる！';}
    else if(G.money>=5000){rank='B';msg='いい手際。段取りが光る。';}}
  else{rank='D';msg='また明日、のれんを出そう。';}
  txt('ランク',W/2,310,10,'#8b90a8','center');
  txt(rank,W/2,322,36,rank==='S'?'#e8b44a':rank==='A'?'#7fae5a':'#f2e3c2','center');
  if(rank==='A')txt('S条件: 売上13,000＋離脱0人＋廃棄1品以下',W/2,372,8,'#8b90a8','center');
  txt(msg,W/2,390,10,'#c8b890','center');
  if(G.money>=best&&G.money>0)txt('★自己ベスト更新！',W/2,414,10,'#e8b44a','center');
  if(stateAge()>1&&((t*2)|0)%2)txt('▶ タップでもういちど',W/2,450,11,'#e8b44a','center');
}
/* ============================ ループ ============================ */
let last=performance.now(),elT=0;
function loop(now){const dt=Math.min(0.06,(now-last)/1000);last=now;elT+=dt;
  update(dt);x.clearRect(0,0,W,H);
  if(state==='title')drawTitle(elT);else if(state==='result')drawResult(elT);else drawPlay(elT);}
(function frame(){loop(performance.now());requestAnimationFrame(frame);})();
setInterval(()=>{if(performance.now()-last>120)loop(performance.now());},50);
reset();
</script>
