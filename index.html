  else{const s=AC.createBufferSource();s.buffer=noiseBuf();
    const fl=AC.createBiquadFilter();fl.type='highpass';fl.frequency.value=kind==='hat'?7500:1800;
    const g=AC.createGain();
    g.gain.setValueAtTime((kind==='hat'?0.018:0.05)*VOL.bgm*1.5,t0);

function genDish(e){

            : e<30?['kake','ume','nori','mentai','tsukimi','kitsune','onigiri','ebi','kashiwa']
            : DKEYS;
  const ok=pool.filter(d=>G.custs.filter(c=>c&&c.dish===d).length<ORDER_CAP[d]);
  const p2=ok.length?ok:['kake'];
  return p2[(Math.random()*p2.length)|0];
}

/* 実力偏差値・推定上位%（オンラインランキング導入までのローカル推定） */
function erfc(v){const z=Math.abs(v),t=1/(1+0.5*z);
  const r=t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(0.37409196+t*(0.09678418+t*(-0.18628806+t*(0.27886807+t*(-1.13520398+t*(1.48851587+t*(-0.82215223+t*0.17087277)))))))));
  return v>=0?r:2-r;}
function hensa(){const m=G?G.money:0;return Math.max(28,Math.min(99,Math.round(50+10*(m-6000)/3500)));}
function topPct(){const z=(hensa()-50)/10,q=0.5*erfc(z/Math.SQRT2)*100;return q<10?Math.max(0.1,+q.toFixed(1)):Math.round(q);}

function update(dt){
  shareMsgT-=dt;
  if(state!=='play')return;
  G.t+=dt;G.left-=dt;G.msgT-=dt;
  if(G.eggCd>0)G.eggCd-=dt;
  if(G.onigCd>0)G.onigCd-=dt;
  G.chefX+=(G.chefTargetX-G.chefX)*Math.min(1,dt*9);
  /* 来店: 待ち0人なら即補充。さばいた数に応じて間隔短縮（実力連動・上限なし） */
  G.spawnT-=dt;
  if(G.custs.every(c=>!c))G.spawnT=Math.min(G.spawnT,0.35);
  if(G.spawnT<=0){const free=G.custs.map((c,i)=>c?null:i).filter(v=>v!==null);
    if(free.length){const slot=free[(Math.random()*free.length)|0];const d=genDish(G.t),pt=CFG.patience(G.t);
      G.custs[slot]={dish:d,p:pt,maxP:pt,v:CVARS[(Math.random()*CVARS.length)|0],ph:Math.random()*6,id:++G.seq};
      SE.arrive();voice('welcome');}
    const skill=Math.max(0.4,1-G.served*0.015);
    G.spawnT=CFG.spawn(G.t)*(0.8+Math.random()*0.4)*skill;}
  G.custs.forEach((c,i)=>{if(!c)return;c.p-=dt;
    if(c.p<=0){G.custs[i]=null;G.gone++;repAdd(-12);comboReset();SE.bye();
      voice('angry');
      pop(CUSTX[i]+42,CUSTY-4,'帰っちゃった…','#e0604a');}});
  if(G.left<=10&&G.left>0&&((G.left|0)!==((G.left+dt)|0)))SE.tick();
  G.kama.forEach((k,i)=>{if(k.st!=='boil')return;k.t+=dt;
    if(k.t>=CFG.boil&&k.t<CFG.boil+0.05)SE.ding();
    if(k.t>CFG.boil+CFG.golden){k.st='idle';k.t=0;wasteAt(KAMA[i].x+27,KAMA[i].y,'茹ですぎ');}});
  if(G.ageSim!=null){G.ageSim+=dt;if(G.ageSim>=CFG.ageSim){G.age=Math.min(CFG.ageCap,G.age+1);G.ageSim=null;SE.take();pop(AGE.x+25,AGE.y,'油揚げ完成','#e8b44a');}}
  G.fry.forEach((arr,i)=>{for(let j=arr.length-1;j>=0;j--){const fj=arr[j];fj.t+=dt;
    if(fj.t>=FRIED[fj.k].fry){arr.splice(j,1);G.rack.push({k:fj.k,age:0});SE.take();
      pop(FRYG[i].x+26,FRYG[i].y-2,FRIED[fj.k].name+' あがり','#e8b44a');}}});
  for(let i=G.rack.length-1;i>=0;i--){G.rack[i].age+=dt;
    if(G.rack[i].age>FRIED[G.rack[i].k].fresh){const k=G.rack[i].k;G.rack.splice(i,1);
      const gEnt=FRYG.find(gg=>gg.k===k);
      wasteAt(gEnt?gEnt.sx+24:W/2,EQY2,FRIED[k].name);}}
  for(let i=G.udon.length-1;i>=0;i--){G.udon[i].age+=dt;if(G.udon[i].age>CFG.nobi){G.udon.splice(i,1);wasteAt(UDONZ.x+50,UDONZ.y,'のびたうどん');}}
  if(curBGM===BGMA.play)curBGM.playbackRate=(G.left<=25?1.15:1);
  G.pops.forEach(pp=>pp.t+=dt);G.pops=G.pops.filter(pp=>pp.t<1.3);
  G.kama.forEach((k,i)=>{if(k.st==='boil'&&Math.random()<dt*9)G.steam.push({x:KAMA[i].x+10+Math.random()*30,y:KAMA[i].y+6,t:0});});
  if(G.ageSim!=null&&Math.random()<dt*6)G.steam.push({x:AGE.x+16+Math.random()*18,y:AGE.y+6,t:0});
  G.steam.forEach(s=>{s.t+=dt;s.y-=dt*13;});G.steam=G.steam.filter(s=>s.t<1.6);
  if(G.rip){G.rip.t+=dt*2.6;if(G.rip.t>=1)G.rip=null;}
  G.chefF=((G.t*2.6)|0)%2;
  if(G.rep<=0)enterResult(true);
  else if(G.left<=0)enterResult(false);
}

function tapFry(i){const F=FRYG[i];moveChef(F.x+F.w/2);
  if(G.fry[i].length>=2){say(FRIED[F.k].name+'は2個揚げ中！');SE.buzz();return;}
  if(G.rack.filter(r=>r.k===F.k).length+G.fry[i].length>=4){say('ストックが満杯');SE.buzz();return;}
  G.fry[i].push({k:F.k,t:0});SE.fry();pop(F.x+26,F.y-2,FRIED[F.k].name+' 投入','#f2e3c2');}
function tapCust(i){const c=G.custs[i];if(!c)return;const D=DISHES[c.dish];
  if(c.dish==='onigiri'){
    if(G.onigiri<=0){say('おにぎりを握って！');SE.buzz();return;}
    G.onigiri--;
  }else{
    if(!G.udon.length){say('うどんがまだ！');SE.buzz();return;}
    if(D.need){
      if(D.need==='age'){if(G.age<=0){say('油揚げを用意して！');SE.buzz();return;}}
      else if(D.need==='tamago'){if(G.tamago<=0){say('卵を用意して！');SE.buzz();return;}}
      else{if(!G.rack.filter(r=>r.k===D.need).length){say(FRIED[D.need].name+'を揚げて！');SE.buzz();return;}}
    }
    let ou=-1,ua=-1;G.udon.forEach((b,j)=>{if(b.age>ua){ua=b.age;ou=j;}});G.udon.splice(ou,1);
    if(D.need==='age')G.age--;
    else if(D.need==='tamago')G.tamago--;
    else if(D.need){let old=-1,age=-1;G.rack.forEach((r,j)=>{if(r.k===D.need&&r.age>age){age=r.age;old=j;}});G.rack.splice(old,1);}
  }
  G.money+=D.price;G.served++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);repAdd(4+Math.round(c.p/c.maxP*6));
  const bonus=G.combo>=3?Math.round(D.price*0.1*Math.min(G.combo-2,8)):0;G.money+=bonus;
  G.custs[i]=null;SE.coin();
  if(G.combo===5||G.combo===10)SE.jingle();
  voice('happy');
  pop(CUSTX[i]+42,CUSTY-4,'+¥'+(D.price+bonus).toLocaleString(),'#e8b44a',true);
  if(G.combo>=3)pop(CUSTX[i]+42,CUSTY+12,'連続×'+G.combo+(bonus?' +'+bonus:''),'#7fae5a');}

}

}
/* ============================ ループ ============================ */
let last=performance.now(),elT=0;
function loop(now){const dt=Math.min(0.06,(now-last)/1000);last=now;elT+=dt;
  update(dt);x.clearRect(0,0,W,H);
  if(state==='title')drawTitle(elT);
  else if(state==='volume')drawVolume(elT);
  else if(state==='result'){
    if(resultFlash>0)resultFlash=Math.max(0,resultFlash-dt*1.4);
    confetti.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.r+=p.rv*dt;});
    confetti=confetti.filter(p=>p.y<H+12);
    drawResult(elT);
    if(shareCapPending&&stateAge()>0.2){shareCapPending=false;captureShare();}
  }
  else drawPlay(elT);}
(function frame(){loop(performance.now());requestAnimationFrame(frame);})();
setInterval(()=>{if(performance.now()-last>120)loop(performance.now());},50);
reset();
</script>
