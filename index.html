}
/* ============================ ループ ============================ */
let last=performance.now(),elT=0;
function loop(now){const dt=Math.min(0.06,(now-last)/1000);last=now;elT+=dt;
  update(dt);x.clearRect(0,0,W,H);
  if(state==='title')drawTitle(elT);
  else if(state==='volume')drawVolume(elT);
  else if(state==='result'){
    if(resultFlash>0)resultFlash=Math.max(0,resultFlash-dt*1.4);
    confetti.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.r+=p.rv*dt;});
    confetti=confetti.filter(p=>p.y<H+12);
    drawResult(elT);
    if(shareCapPending&&stateAge()>0.2){shareCapPending=false;captureShare();}
  } else drawPlay(elT);}
(function frame(){loop(performance.now());requestAnimationFrame(frame);})();
setInterval(()=>{if(performance.now()-last>120)loop(performance.now());},50);
reset();
</script>
